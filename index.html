              "@type": "Question",
              "name": "What happens during our initial free consultation?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Our free introductory video consultation is a gentle, informal opportunity to meet each other. You can briefly share what is prompting you to seek therapy, ask any practical questions about my style, and see if working together feels comfortable. There is absolutely no pressure or obligation to book ongoing sessions."

              "@type": "Question",
              "name": "Do you offer couples counselling, or can I come on my own for relationship issues?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "I work 1-to-1 with individuals rather than couples in the room together. However, a huge part of my work involves untangling relationship patterns, repeating arguments, and communication breakdowns. You don't need both partners present to change a dynamic: when one person understands their side of the loop and shifts how they respond, the whole relationship changes."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need a GP referral or a medical diagnosis to see you?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No, you do not need a GP referral or medical diagnosis. You can self-refer directly by getting in touch to arrange an introductory chat. In the UK, public mental health routes often involve lengthy waiting lists or rigid triage questionnaires. Private therapy allows us to start working together immediately without administrative delays. My clinical work is bound by the UKCP Ethical Framework and supported by regular clinical supervision."
              }
            },
            {
              "@type": "Question",
              "name": "How do I prepare for our first session? What if I do not know what to say?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You do not need to prepare a script, a neat timeline, or a tidy summary of your symptoms. In many medical appointments, you have ten minutes to summarize your entire life's pain. In our sessions, the clock does not run that way. We get to know each other at an unhurried pace. If all you can say is \"I just feel off and I don't know why,\" that is a completely valid place to begin."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need to get my life completely stable before starting therapy?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. You do not need to have your life sorted out before you deserve support. People are sometimes told they must reach a stable baseline before qualifying for psychological help. Therapy is the very space where stability is built. Whether you are dealing with burnout, emotional turbulence, or an unsettled daily environment, we meet you where you are."
              }

                "@type": "Answer",
                "text": "Both in-person and online 50-minute sessions are £30. Payment is made via simple bank transfer against a monthly or per-session invoice. Our initial video consultation is always free of charge so you can decide if the fit feels right before committing financially."
              }
            },

              "@type": "Question",
              "name": "Do you offer sliding-scale or concession rates?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. I hold dedicated concession and sliding-scale slots specifically for students, trainees, and those currently on low or unwaged incomes. If financial constraints are a barrier to accessing regular support, please let me know during our initial conversation so we can discuss availability."
              }
            },
            {
              "@type": "Question",
              "name": "What is your cancellation and rescheduling policy?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "I ask for 48 hours notice for cancellations or rescheduling. This allows me to offer the slot to someone else and keeps our therapeutic commitment predictable and boundaried. If you give at least 48 hours notice, no fee is charged and we will gladly arrange a replacement time where possible."
              }
            },
            {
              "@type": "Question",
              "name": "Will our sessions go on my permanent NHS medical record?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Your private therapy sessions are strictly confidential and are not shared with your GP or added to your NHS record. Many people worry that exploring personal struggles will result in diagnostic labels on their medical file. Your records are kept entirely separate on a secure, encrypted system in compliance with UK GDPR and data privacy regulations."
              }
            },
            {
              "@type": "Question",
              "name": "What are the boundaries of confidentiality and safeguarding?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Everything you share in our sessions remains strictly confidential between us, with oversight from my UKCP-accredited clinical supervisor (where identifying details are always anonymized). The only legal exception is under standard UK safeguarding requirements if there is immediate risk of serious harm to yourself or someone else. Even in those rare situations, I would always aim to discuss this with you first."
              }
            },
            {
              "@type": "Question",
              "name": "Why does some therapy feel like school worksheets, and how is your approach different?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "If you have previously tried public mental health services, you may have been given CBT worksheets or mood tracking diaries. While structured tasks help some, many find being told to rationalise their thoughts invalidating for deep relational wounds. My practice works relationally using Transactional Analysis. We sit down as two humans to explore your survival scripts, relationship dynamics, and somatic patterns without symptom checklists."
              }
            },
            {
              "@type": "Question",
              "name": "I know why I struggle logically, but it does not change how I feel. Can therapy still help?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "This is a very common experience. You might understand your childhood timeline completely and know logically why you feel anxious, yet your nervous system still reacts with panic or shutdown. Intellectual insight happens in thoughts, but survival defenses live in the body. We focus on experiential, relational change: helping your nervous system register safety and shifting intellectual understanding into felt freedom in daily life."
              }
            },
            {
              "@type": "Question",
              "name": "What if I cry, get angry, or feel overwhelmed? Will I be too much?",

                "@type": "Answer",

              }
            },

                "@type": "Answer",
                "text": "Sessions are 50 minutes long and take place weekly at a regular, agreed-upon time. Weekly continuity creates emotional momentum and safety. We regularly review how the work is feeling for you, and we decide collaboratively when you feel ready to step back or conclude therapy."
